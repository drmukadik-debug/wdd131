<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore the beautiful house of the Lord in my country, in africa and in the world. Inspiring images and see the holy house of the Lord.">
    <meta name="author" content="Alain Kabeya">

    <title>HTML Form</title>

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Merriweather:wght@700&display=swap" rel="stylesheet">

</head>

<body>

    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">
            <label for="product">Product Name:</label>

            <select id="product" name="product" required>
                <option value="" selected disabled>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>
                <input type="radio" id="rating1" name="rating" value="1" required>
                <label for="rating1">☆</label>
                <input type="radio" id="rating2" name="rating" value="2">
                <label for="rating2">☆☆</label>
                <input type="radio" id="rating3" name="rating" value="3">
                <label for="rating3">☆☆☆</label>
                <input type="radio" id="rating4" name="rating" value="4">
                <label for="rating4">☆☆☆☆</label>
                <input type="radio" id="rating5" name="rating" value="5">
                <label for="rating5">☆☆☆☆☆</label>
            </fieldset>
            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>
            <fieldset>
                <legend>Which features did you find useful?</legend>
                <label for="durability">
                    <input 
                    type="checkbox"
                    id="durability" 
                    name="features" 
                    value="Durability">
                    Durability
                </label>
                <label for="ease">
                    <input 
                    type="checkbox"
                    id="ease"  
                    name="features" 
                    value="Ease of Use">
                    Ease of Use
                </label>
                <label for="performance">
                    <input 
                    type="checkbox"
                    id="performance"  
                    name="features" 
                    value="Performance">
                    Performance
                </label>
                <label for="design">
                    <input 
                    type="checkbox"
                    id="design" 
                    name="features" 
                    value="Design">
                    Design
                </label>
            </fieldset>
            <label for="review"> Written Review</label>
            <textarea id="review" name="review"></textarea>
            <label for="username">Your Name</label>
            <input type="text" id="username" name="username">
            <input type="submit" value="Post Review">
        </form>

    </main>

    <footer>
        <p>&copy; <span id="currentyear"></span> | Alain Mukadi Kabeya | Democratic Republic of the Congo.</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
